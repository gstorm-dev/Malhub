<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
   <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex justify-center items-center bg-gray-100 min-h-screen">
  
  <div class="shadow-sm rounded-xl w-95 bg-white flex items-center justify-center flex-col">

    <h1 class="text-2xl font-bold mb-3 pt-4">Callback Function</h1>

    <input id="addTask" type="text" class="flex-1 border border-gray-300 w-60 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-indigo-500 mb-4">
    <p id="message" class="text-sm text-green-500 mb-5 text-center"></p>

    <div class="flex items-center justify-center gap-4 pb-4">
      <button id="nameBtn" class="text-sm bg-blue-600 py-2 px-2 rounded-sm text-white">Show name</button>

      <button id="ageBtn" class="text-sm bg-yellow-500 py-2 px-2 text-white rounded-sm">Show age</button>

      <button id="dataBtn" class="text-sm bg-green-600 py-2 px-2 text-white rounded-sm">Show data</button>
            <button id="greetBtn" class="text-sm bg-slate-600 py-2 px-2 text-white rounded-sm">Show</button>

    </div>
  </div>

  <script>

   


    function timeout(timer) {
      document.getElementById('message').textContent = "Loading...";

      setTimeout(() => {
        const info = {name: 'Glorysamson', age: 18};
        timer(info);
      }, 2000);
    };

    document.getElementById('nameBtn').addEventListener("click", () => {
      timeout((info) => {
        
        document.getElementById('message').textContent = `My name is, ${document.getElementById('addTask').value || info.name}`
      })
    });

    document.getElementById('ageBtn').addEventListener("click", () => {
      timeout((info) => {

        document.getElementById('message').textContent = `I am, ${document.getElementById('addTask').value || info.age}, years old`;
      })
    });
    
    document.getElementById('dataBtn').addEventListener("click", () => {
      timeout((info) => {

        document.getElementById('message').textContent = `My name is, ${info.name}, and I am, ${document.getElementById('addTask').value || info.age}, years old`;
      })
    });

    function show(text) {
      document.getElementById('message').textContent = `Good morning ${text}`;
    }

    document.getElementById('greetBtn').addEventListener("click", () => {
      const task = document.getElementById('addTask').value || 'buddy'
      timeout((info) => {
        show(task)
      })
    })

    let me = document.getElementById('us')

    function showUs(text) {
      me.textContent = text;
    }
  </script>
</body>
</html>
