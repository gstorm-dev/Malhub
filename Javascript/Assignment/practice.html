<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  
  <div class="flex flex-col items-center justify-center gap-4 w-[300px] mx-auto rounded-xl p-4 mt-10 bg-slate-800" id="buttonContainer" onclick="
    containerColor()">

    <h1 class="text-[30px] font-bold text-white">Color Changer</h1>
    <p class="text-[10px] text-white text-center">Click the buttons below to change the background color provided by JavaScript.</p>
    <button class="bg-black text-white px-4 py-2 rounded hover:bg-gray-700 cursor-pointer" id="blackBtn" onclick="
      black()
    ">Black</button>
    <button class="bg-white text-black px-4 py-2 rounded hover:bg-gray-300 cursor-pointer" id="whiteBtn" onclick="
      white()
    ">White</button>
    <button class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 cursor-pointer" id="redBtn" onclick="
      red()
    ">Red</button>
    <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 cursor-pointer" id="blueBtn" onclick="
      blue()
    ">Blue</button>

    <button class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600 cursor-pointer" id="purpleBtn" onclick="
      purple()
    ">Purple</button>
  </div>
  
  <script>

    let buttonContainer = document.getElementById("buttonContainer");
    let blackBtn = document.getElementById("blackBtn");
    let whiteBtn = document.getElementById("whiteBtn");
    let redBtn = document.getElementById("redBtn");
    let blueBtn = document.getElementById("blueBtn");
    let purpleBtn = document.getElementById("purpleBtn");


    function containerColor() {
      buttonContainer.style.backgroundColor = 'lightgray';
      buttonContainer.style.boxShadow = '0 0 10px rgba(0, 0, 0, 0.5)';
      buttonContainer.style.borderRadius = '80px';
    }

    function black() {
      blackBtn.style.backgroundColor = "pink";  
    }

    function white() {
      whiteBtn.style.backgroundColor = "gray";  
    }

    function red() {
      redBtn.style.backgroundColor = "darkred";  
    }

    function blue() {
      blueBtn.style.backgroundColor = "darkblue";  
    }

    function purple() {
      purpleBtn.style.backgroundColor = "darkmagenta";  
    }
  </script>
</body>
</html>
